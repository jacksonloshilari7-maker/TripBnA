<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="dotShadowMask" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- Full-bleed top and bottom neon green stripes -->
  <rect x="0" y="0" width="512" height="50" fill="#00e500"/>
  <rect x="0" y="462" width="512" height="50" fill="#00e500"/>

  <!-- Logo centered safely within 80% circle safe zone (scale 0.375) -->
  <g transform="translate(54, 102) scale(0.372)">
    <text x="80" y="320" font-family="'Times New Roman', Georgia, serif" font-size="210" font-weight="900" fill="#111111">T</text>
    <text x="210" y="320" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="190" font-weight="900" fill="#008037">r</text>
    <text x="315" y="320" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="190" font-weight="900" fill="#f59e0b">i</text>
    <text x="375" y="320" font-family="'Times New Roman', Georgia, serif" font-size="205" font-weight="900" fill="#111111">p</text>
    <path d="M 400 325 C 385 365 355 405 305 410 C 265 415 220 380 180 340" fill="none" stroke="#111111" stroke-width="9" stroke-linecap="round"/>

    <g filter="url(#dotShadowMask)">
      <circle cx="85" cy="425" r="40" fill="#ffffff"/>
      <circle cx="85" cy="425" r="34" fill="#111111"/>
    </g>
    <g filter="url(#dotShadowMask)">
      <circle cx="190" cy="432" r="34" fill="#ffffff"/>
      <circle cx="190" cy="432" r="28" fill="#008037"/>
    </g>
    <g filter="url(#dotShadowMask)">
      <circle cx="280" cy="412" r="28" fill="#ffffff"/>
      <circle cx="280" cy="412" r="22" fill="#f59e0b"/>
    </g>

    <text x="475" y="320" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="220" font-weight="900" fill="#008037">B</text>
    <text x="640" y="320" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="190" font-weight="900" fill="#f59e0b">n</text>
    <text x="750" y="320" font-family="'Times New Roman', Georgia, serif" font-size="235" font-weight="900" fill="#111111">A</text>
    <text x="945" y="320" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="95" font-weight="900" fill="#111111">.com</text>

    <rect x="450" y="340" width="165" height="11" fill="#008037" rx="3"/>
    <rect x="620" y="340" width="125" height="11" fill="#f59e0b" rx="3"/>
    <rect x="750" y="340" width="200" height="11" fill="#111111" rx="3"/>

    <rect x="450" y="363" width="165" height="11" fill="#008037" rx="3"/>
    <rect x="620" y="363" width="125" height="11" fill="#f59e0b" rx="3"/>
    <rect x="750" y="363" width="200" height="11" fill="#111111" rx="3"/>
  </g>
